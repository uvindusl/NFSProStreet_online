<!doctype html>
<meta charset=utf-8>
<title>ProStreet draw_real — real ABI, real PS</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#0f0;font-family:monospace;font-size:12px;overflow:hidden}
#log{position:fixed;top:8px;left:8px;color:#0f0;background:rgba(0,0,0,0.85);padding:8px;z-index:10;max-width:96vw;max-height:90vh;overflow:auto;white-space:pre-wrap}
</style>
<div id="log"></div>
<script type=module>
const logEl = document.getElementById('log');
const log = (m) => { logEl.textContent += m + '\n'; logEl.scrollTop = logEl.scrollHeight; console.log(m); };

const WGSL_PS = "// ps_0: ps_2_0, 3 instructions\nstruct VOut {\n  @builtin(position) pos: vec4f,\n  @location(0) col0: vec4f, @location(1) col1: vec4f,\n  @location(2) uv0: vec4f, @location(3) uv1: vec4f, @location(4) uv2: vec4f, @location(5) uv3: vec4f,\n  @location(6) uv4: vec4f, @location(7) uv5: vec4f, @location(8) uv6: vec4f, @location(9) uv7: vec4f,\n  @location(10) fog: f32,\n}\nstruct PSPar { aref: f32, usec: f32, pad0: f32, pad1: f32, proj: vec4f, c: array<vec4f, 32>, fog: vec4f }\n@group(0) @binding(2) var<uniform> P: PSPar;\noverride ALPHA_FUNC: u32 = 7u;\noverride PS20_TEXCOORD: bool = true;\nfn alpha_pass(a: f32, r: f32) -> bool {\n  switch ALPHA_FUNC {\n    case 1u: { return false; }\n    case 2u: { return a < r; }\n    case 3u: { return a == r; }\n    case 4u: { return a <= r; }\n    case 5u: { return a > r; }\n    case 6u: { return a != r; }\n    case 7u: { return !(a < r); }\n    default: { return true; }\n  }\n}\nfn ps_end(c: vec4f, fog: f32) -> vec4f {\n  if (ALPHA_FUNC != 8u) { if (!alpha_pass(c.a, P.aref)) { discard; } }\n  return vec4f(mix(P.fog.rgb, c.rgb, mix(1.0, saturate(fog), P.fog.a)), c.a);\n}\nfn tcoord(q: vec4f, sel: f32) -> vec2f {\n  let m = i32(sel) >> 4u;\n  return q.xy / select(select(1.0, q.z, m == 1), q.w, m == 2);\n}\nstruct PSOut { @location(0) col: vec4f, @builtin(frag_depth) depth: f32 };\n@group(1) @binding(0) var tex0: texture_2d<f32>;\n@group(1) @binding(1) var tex1: texture_2d<f32>;\n@group(1) @binding(2) var tex2: texture_2d<f32>;\n@group(1) @binding(3) var tex3: texture_2d<f32>;\n@group(1) @binding(4) var tex4: texture_2d<f32>;\n@group(1) @binding(5) var tex5: texture_2d<f32>;\n@group(1) @binding(6) var tex6: texture_2d<f32>;\n@group(1) @binding(7) var tex7: texture_2d<f32>;\n@group(1) @binding(8) var smp0: sampler;\n@group(1) @binding(9) var smp1: sampler;\n@group(1) @binding(10) var smp2: sampler;\n@group(1) @binding(11) var smp3: sampler;\n@group(1) @binding(12) var smp4: sampler;\n@group(1) @binding(13) var smp5: sampler;\n@group(1) @binding(14) var smp6: sampler;\n@group(1) @binding(15) var smp7: sampler;\n@fragment fn ps_042(i: VOut) -> @location(0) vec4f {\n  var r0 = vec4f(0.0);\n  let c0 = vec4f(1.0, 1.0, 1.0, 0.5);\n  var oC = vec4f(0.0);\n  r0 = c0;\n  oC = r0;\n  return ps_end(oC, i.fog);\n}\n";
const WGSL_VS = "struct VOut {\n  @builtin(position) pos: vec4f,\n  @location(0) col0: vec4f, @location(1) col1: vec4f,\n  @location(2) uv0: vec4f, @location(3) uv1: vec4f, @location(4) uv2: vec4f, @location(5) uv3: vec4f,\n  @location(6) uv4: vec4f, @location(7) uv5: vec4f, @location(8) uv6: vec4f, @location(9) uv7: vec4f,\n  @location(10) fog: f32,\n};\n@vertex fn main(@builtin(vertex_index) vid: u32) -> VOut {\n  // NOTE: placeholder vertex shader, NOT the real emitted VS. Draws one\n  // full-screen triangle so the real ProStreet pixel shader can run.\n  var pos = array<vec4f, 3>(\n    vec4f(-1.0, -1.0, 0.0, 1.0),\n    vec4f(3.0, -1.0, 0.0, 1.0),\n    vec4f(-1.0, 3.0, 0.0, 1.0)\n  );\n  var uv0 = array<vec4f, 3>(\n    vec4f(0.0, 1.0, 0.0, 1.0), vec4f(1.0, 1.0, 0.0, 1.0), vec4f(0.0, 0.0, 0.0, 1.0)\n  );\n  var uv1 = array<vec4f, 3>(\n    vec4f(0.0, 1.0, 0.0, 1.0), vec4f(1.0, 1.0, 0.0, 1.0), vec4f(0.0, 0.0, 0.0, 1.0)\n  );\n  var fog = array<f32, 3>(1.0, 1.0, 1.0);\n  var col0 = array<vec4f, 3>(vec4f(1.0), vec4f(1.0), vec4f(1.0));\n  var col1 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv2 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv3 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv4 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv5 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv6 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  var uv7 = array<vec4f, 3>(vec4f(0.0), vec4f(0.0), vec4f(0.0));\n  return VOut(pos[vid], col0[vid], col1[vid], uv0[vid], uv1[vid], uv2[vid], uv3[vid], uv4[vid], uv5[vid], uv6[vid], uv7[vid], fog[vid]);\n}\n";

// Real ABI sizes (mirror web/src/gpu/shader-abi.ts).
const KWIN_SIZE = 65536;
const PSPAR_SIZE = 560;
const HLPAR_SIZE = 656;

(async () => {
  if (!navigator.gpu) { log('FATAL: NO navigator.gpu'); return; }
  const adapter = await navigator.gpu.requestAdapter();
  if (!adapter) { log('FATAL: NO adapter'); return; }
  log('adapter: ' + JSON.stringify(adapter.info));
  const device = await adapter.requestDevice();
  log('device ready');

  // --- Explicit ABI bind group layouts (mirror createShaderAbi) ---
  const V = GPUShaderStage.VERTEX, F = GPUShaderStage.FRAGMENT;
  const group0 = device.createBindGroupLayout({
    label: 'abi.group0',
    entries: [
      { binding: 0, visibility: V, buffer: { type: 'read-only-storage' } },
      { binding: 1, visibility: V, buffer: { type: 'uniform', hasDynamicOffset: true, minBindingSize: KWIN_SIZE } },
      { binding: 2, visibility: F, buffer: { type: 'uniform', hasDynamicOffset: true, minBindingSize: PSPAR_SIZE } },
      { binding: 3, visibility: F, buffer: { type: 'uniform', hasDynamicOffset: true, minBindingSize: HLPAR_SIZE } },
    ],
  });
  const group1 = device.createBindGroupLayout({ label: 'abi.group1', entries: [
    { binding: 0, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 1, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 2, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 3, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 4, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 5, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 6, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 7, visibility: F, texture: { sampleType: 'float', viewDimension: '2d' } },
    { binding: 8, visibility: F, sampler: { type: 'filtering' } },
    { binding: 9, visibility: F, sampler: { type: 'filtering' } },
    { binding: 10, visibility: F, sampler: { type: 'filtering' } },
    { binding: 11, visibility: F, sampler: { type: 'filtering' } },
    { binding: 12, visibility: F, sampler: { type: 'filtering' } },
    { binding: 13, visibility: F, sampler: { type: 'filtering' } },
    { binding: 14, visibility: F, sampler: { type: 'filtering' } },
    { binding: 15, visibility: F, sampler: { type: 'filtering' } },
  ]});
  const pipelineLayout = device.createPipelineLayout({
    label: 'abi.layout2d',
    bindGroupLayouts: [group0, group1],
  });
  log('ABI layouts + pipeline layout created');

  const vsMod = device.createShaderModule({ code: WGSL_VS });
  const fsMod = device.createShaderModule({ code: WGSL_PS });
  log('shader modules created');

  const canvas = document.createElement('canvas');
  canvas.width = 256; canvas.height = 256;
  canvas.style.border = '1px solid #0f0';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('webgpu');
  const fmt = navigator.gpu.getPreferredCanvasFormat();
  ctx.configure({ device, format: fmt, alphaMode: 'opaque' });

  // --- Offscreen render texture ---
  const texW = 256, texH = 256;
  const renderTex = device.createTexture({
    size: [texW, texH], format: fmt,
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC,
  });

  // --- VB storage (empty, placeholder VS doesn't read it) ---
  const vbBuf = device.createBuffer({
    size: 256, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST,
  });

  // --- K window block (65536) ---
  const kBuf = device.createBuffer({ size: KWIN_SIZE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  // --- P block (560): aref=0, c all zero, fog zero ---
  const pBuf = device.createBuffer({ size: PSPAR_SIZE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  // --- H block (656) zero ---
  const hBuf = device.createBuffer({ size: HLPAR_SIZE, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

  // --- 1x1 white texture + filtering sampler ---
  const whiteData = new Uint8Array([255, 255, 255, 255]);
  const tex0 = device.createTexture({ size: [1, 1], format: 'rgba8unorm', usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
  device.queue.writeTexture({ texture: tex0 }, whiteData, { bytesPerRow: 4 }, [1, 1]);
  const smp0 = device.createSampler({ magFilter: 'linear', minFilter: 'linear' });

  const pipeline = device.createRenderPipeline({
    layout: pipelineLayout,
    vertex: { module: vsMod, entryPoint: 'main' },
    fragment: { module: fsMod, entryPoint: 'ps_042', targets: [{ format: fmt }] },
    primitive: { topology: 'triangle-list' },
  });
  log('pipeline created with explicit ABI layout');

  const bg0 = device.createBindGroup({
    layout: group0,
    entries: [
      { binding: 0, resource: { buffer: vbBuf } },
      { binding: 1, resource: { buffer: kBuf, offset: 0, size: KWIN_SIZE } },
      { binding: 2, resource: { buffer: pBuf, offset: 0, size: PSPAR_SIZE } },
      { binding: 3, resource: { buffer: hBuf, offset: 0, size: HLPAR_SIZE } },
    ],
  });
  const bg1 = device.createBindGroup({
    layout: group1,
    entries: [
      { binding: 0, resource: tex0.createView() },
      { binding: 1, resource: tex0.createView() },
      { binding: 2, resource: tex0.createView() },
      { binding: 3, resource: tex0.createView() },
      { binding: 4, resource: tex0.createView() },
      { binding: 5, resource: tex0.createView() },
      { binding: 6, resource: tex0.createView() },
      { binding: 7, resource: tex0.createView() },
      { binding: 8, resource: smp0 },
      { binding: 9, resource: smp0 },
      { binding: 10, resource: smp0 },
      { binding: 11, resource: smp0 },
      { binding: 12, resource: smp0 },
      { binding: 13, resource: smp0 },
      { binding: 14, resource: smp0 },
      { binding: 15, resource: smp0 },
    ],
  });

  // Draw into offscreen texture
  const enc = device.createCommandEncoder();
  const pass = enc.beginRenderPass({
    colorAttachments: [{
      view: renderTex.createView(),
      clearValue: { r: 0, g: 0, b: 0, a: 1 },
      loadOp: 'clear', storeOp: 'store',
    }],
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bg0, [0, 0, 0]);   // dynamic offsets for K, P, H
  pass.setBindGroup(1, bg1);
  pass.draw(3);
  pass.end();

  // Copy offscreen texture to readback buffer
  const bytesPerRow = 256;
  const patchSize = 4;
  const readBuf = device.createBuffer({
    size: bytesPerRow * patchSize,
    usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ,
  });
  enc.copyTextureToBuffer(
    { texture: renderTex, origin: { x: 0, y: 0 } },
    { buffer: readBuf, bytesPerRow },
    [patchSize, patchSize]
  );
  device.queue.submit([enc.finish()]);

  await device.queue.onSubmittedWorkDone();
  await readBuf.mapAsync(GPUMapMode.READ);
  const pixels = new Uint8Array(readBuf.getMappedRange());

  // Centre pixel (128,128) + 4x4 patch at origin (top-left).
  const cx = Math.floor(texW / 2), cy = Math.floor(texH / 2);
  const readCenter = async () => {
    const probe = device.createBuffer({ size: 256, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
    const p2 = device.createCommandEncoder();
    p2.copyTextureToBuffer(
      { texture: renderTex, origin: { x: cx, y: cy } },
      { buffer: probe, bytesPerRow: 256 },
      [1, 1]
    );
    device.queue.submit([p2.finish()]);
    await device.queue.onSubmittedWorkDone();
    await probe.mapAsync(GPUMapMode.READ);
    const mapped = probe.getMappedRange();
    const c = new Uint8Array(mapped);
    const centerVals = [c[0], c[1], c[2], c[3]];
    probe.unmap();
    probe.destroy();
    return centerVals;
  };
  const center = await readCenter();

  const patch = [];
  for (let row = 0; row < patchSize; row++) {
    const rowVals = [];
    for (let col = 0; col < patchSize; col++) {
      const idx = row * bytesPerRow + col * 4;
      rowVals.push([pixels[idx], pixels[idx+1], pixels[idx+2], pixels[idx+3]]);
    }
    patch.push(rowVals);
  }

  // All pixels should be (255,255,255,128) -> c0=(1,1,1,0.5), fog.a=0 so no fog blend, alpha pass ok.
  const ok = patch.every(row => row.every(p => p[0] === 255 && p[1] === 255 && p[2] === 255 && p[3] === 128))
    && center[0] === 255 && center[1] === 255 && center[2] === 255 && center[3] === 128;

  log('DRAW_REAL ' + JSON.stringify({
    ok,
    center,
    patch,
    expected: [255, 255, 255, 128],
    note: 'ps_2_0_042 emits c0=(1,1,1,0.5); P.aref=0 so alpha_pass(0.5,0)=true; P.fog.a=0 so no fog blend',
  }));

  // Present the same draw to the visible canvas so the capture script can screenshot it.
  const presentEnc = device.createCommandEncoder();
  const presentPass = presentEnc.beginRenderPass({
    colorAttachments: [{ view: ctx.getCurrentTexture().createView(), clearValue: {r:0,g:0,b:0,a:1}, loadOp:'clear', storeOp:'store' }],
  });
  presentPass.setPipeline(pipeline);
  presentPass.setBindGroup(0, bg0, [0, 0, 0]);
  presentPass.setBindGroup(1, bg1);
  presentPass.draw(3);
  presentPass.end();
  device.queue.submit([presentEnc.finish()]);
  await device.queue.onSubmittedWorkDone();

  log('PNG will be saved by the capture script screenshot.');
  log('DRAW_REAL_DONE');
})().catch(e => { log('ERR: ' + e.message); console.error(e); });
</script>
