name: OpenCode PR Review Comment

on:
  workflow_run:
    workflows: ["OpenCode PR Review"]
    types: [completed]

permissions:
  actions: read
  pull-requests: write

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download review artifact
        id: download
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: opencode-pr-review
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: review-artifact

      - name: Post PR comment
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          pr_file="review-artifact/pr-number.txt"
          body_file="review-artifact/review.md"
          [ -f "$pr_file" ] || { echo "Missing pr-number.txt"; exit 1; }
          pr=$(tr -dc '0-9' < "$pr_file")
          [ -n "$pr" ] || { echo "Invalid PR number"; exit 1; }

          if [ ! -s "$body_file" ]; then
            echo "OpenCode review failed or produced no output. Run: $RUN_URL" > "$body_file"
          fi

          {
            echo "## OpenCode PR Review"
            echo
            cat "$body_file"
          } > comment.md

          gh pr comment "$pr" --repo "$REPO" --body-file comment.md
