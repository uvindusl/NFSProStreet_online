name: OpenCode PR Review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install OpenCode CLI
        run: npm install --global @opencode/cli

      - name: Sign in to OpenCode
        env:
          AUDIENCE: https://opencode.ai/console
          CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Review pull request
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          out="opencode-review.md"
          prompt="Review pull request #${PR_NUMBER} in this checked-out repository. Focus on correctness, regressions, security, and missing tests. Summarize any issues and call out anything risky. Use concise markdown."

          opencode run --standalone --format default --model opencode/big-pickle "$prompt" | tee "$out"

          if [ ! -s "$out" ]; then
            echo "OpenCode produced no review output" > "$out"
          fi

          {
            echo "## OpenCode PR Review"
            echo
            cat "$out"
          } > opencode-review-comment.md

          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file opencode-review-comment.md
