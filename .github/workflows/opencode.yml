name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  opencode:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        (contains(github.event.comment.body, '/oc') ||
         contains(github.event.comment.body, '/opencode'))) ||
      (github.event_name == 'pull_request_review_comment' &&
        (contains(github.event.comment.body, '/oc') ||
         contains(github.event.comment.body, '/opencode')))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Get OpenCode OIDC token
        env:
          AUDIENCE: https://opencode.ai/console
          CLIENT_ID: ${{ secrets.OPENCODE_CLIENT_ID }}
        run: |
          set -euo pipefail
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id="$CLIENT_ID" \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/big-pickle
          prompt: |
            Review this pull request for correctness, regressions, security issues, and missing tests.
            Be concise, specific, and actionable. Call out risky changes.
